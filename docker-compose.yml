services:
  app:
    build: .
    container_name: torrent-studio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      QBT_URL: http://qbittorrent:8080
    ports:
      - "3000:3000"
    volumes:
      - ./downloads:/app/storage/downloads
      - ./storage:/app/storage
    depends_on:
      qbittorrent:
        condition: service_started
    networks:
      - torrent

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: torrent-qbittorrent
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Kolkata
      WEBUI_PORT: "8080"
    volumes:
      - ./qbittorrent-config:/config
      - ./downloads:/downloads
    expose:
      - "8080"
    ports:
      - "6881:6881/tcp"
      - "6881:6881/udp"
    networks:
      - torrent

networks:
  torrent:
    driver: bridge
