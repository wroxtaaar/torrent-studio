services:
  app:
    build: .
    container_name: torrent-studio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      QBT_URL: http://qbittorrent:8080
      PROWLARR_URL: http://prowlarr:9696
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - ./downloads:/app/storage/downloads
      - ./app-meta:/app/storage/meta
    depends_on:
      qbittorrent:
        condition: service_started
    networks:
      - torrent

  flaresolverr:
    build: ./flaresolverr-proxy
    container_name: torrent-flaresolverr
    restart: unless-stopped
    environment:
      PORT: "8191"
      UPSTREAM_URL: http://flaresolverr-core:8191
      FLARESOLVERR_SESSION: torrent-studio-search
    expose:
      - "8191"
    depends_on:
      flaresolverr-core:
        condition: service_started
    networks:
      - torrent

  flaresolverr-core:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: torrent-flaresolverr-core
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      LOG_FILE: none
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
      TZ: Asia/Kolkata
      PORT: "8191"
    expose:
      - "8191"
    networks:
      - torrent

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: torrent-prowlarr
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Kolkata
    volumes:
      - ./prowlarr-config:/config
    expose:
      - "9696"
    ports:
      - "127.0.0.1:9696:9696"
    networks:
      - torrent

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: torrent-qbittorrent
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Kolkata
      WEBUI_PORT: "8080"
    volumes:
      - ./qbittorrent-config:/config
      - ./downloads:/downloads
    expose:
      - "8080"
    ports:
      - "6881:6881/tcp"
      - "6881:6881/udp"
    networks:
      - torrent

networks:
  torrent:
    driver: bridge
